<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm cream background -->
  <rect width="512" height="512" fill="#F5F1E8"/>
  
  <!-- Subtle border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#C4B5A0" stroke-width="2"/>
  
  <!-- Text: DR. LUCAS MURREY in clean typography -->
  <text x="256" y="200" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="300"
        fill="#5A4E42" 
        text-anchor="middle"
        letter-spacing="8">DR.</text>
  
  <text x="256" y="280" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="400"
        fill="#3D3530" 
        text-anchor="middle"
        letter-spacing="4">LUCAS</text>
  
  <text x="256" y="350" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="400"
        fill="#3D3530" 
        text-anchor="middle"
        letter-spacing="4">MURREY</text>
</svg>